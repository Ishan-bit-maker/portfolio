<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Ishan Shrestha — the journal." />
    <title>Blog — Ishan Shrestha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0d0d0d;
        --fg: rgba(245, 245, 245, 0.94);
        --muted: rgba(245, 245, 245, 0.48);
        --faint: rgba(245, 245, 245, 0.22);
        --blue: #73b1ff;
        --blue-dim: rgba(115, 177, 255, 0.85);
        --green-date: #5c7e5c;
        --term-green: #4ade80;
        --proj-name: #7ff5e1;
        --proj-name-hover: #f0fffc;
        --wip: #c9a06c;
        --sel-bg: rgba(115, 177, 255, 0.18);
        --sel-fg: var(--fg);
        --max: 720px;
        --ease: 0.18s ease;
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        line-height: 1.75;
      }

      ::selection {
        background: var(--sel-bg);
        color: var(--sel-fg);
      }

      a {
        color: var(--blue);
        text-decoration: none;
        transition: color var(--ease), opacity var(--ease);
      }
      a:hover {
        color: var(--blue-dim);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      a:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
        border-radius: 4px;
      }
      a:visited { color: var(--blue); }

      .wrap {
        max-width: var(--max);
        margin: 0 auto;
        padding: 38px 18px 80px;
      }

      header { margin-top: 8px; }

      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px 18px;
        margin-bottom: 32px;
        color: #ffffff;
        font-size: 13px;
      }
      nav a {
        color: inherit;
        text-decoration: none;
      }
      nav a:hover {
        color: #ffffff;
        text-decoration: none;
        opacity: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 1.85rem);
        font-weight: 700;
        font-style: italic;
        letter-spacing: -0.02em;
        color: var(--blue);
      }

      .sub {
        margin-top: 8px;
        color: var(--fg);
        font-size: 13px;
        font-style: normal;
        font-weight: 400;
      }

      main { margin-top: 48px; }

      .list {
        display: grid;
        gap: 1.75rem;
      }

      .row {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 16px;
      }

      .date {
        color: var(--green-date);
        font-size: 13px;
        opacity: 0.9;
      }

      .txt a {
        color: #ffffff !important;
        font-weight: 500;
      }
      .txt a:hover {
        opacity: 0.75;
        text-decoration: none;
      }

      footer {
        margin-top: 56px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 18px;
        color: #ffffff;
        font-size: 13px;
      }
      footer a,
      footer a:visited {
        color: #ffffff;
        text-decoration: none;
      }
      footer a:hover {
        color: #ffffff;
        opacity: 0.72;
        text-decoration: none;
      }

      @media (max-width: 600px) {
        .row { grid-template-columns: 1fr; gap: 6px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <nav aria-label="Primary">
          <a href="index.html">home</a>
          <a href="blog.html">blog</a>
          <a href="dailies.html">dailies</a>
          <a href="about-min.html">about</a>
          <a href="resources.html">resources</a>
        </nav>

        <h1>the journal</h1>
        <div class="sub">notes on software engineering, learning, and keeping things simple.</div>
      </header>

      <main>
        <div class="list">
          <div class="row">
            <div class="date">2026-03-15</div>
            <div class="txt"><a href="survival-log.html">A Survival Log</a></div>
          </div>

          <div class="row">
            <div class="date">2026-02-10</div>
            <div class="txt"><a href="#">Keeping Things Small</a></div>
          </div>
        </div>
      </main>

      <footer>
        <a href="https://github.com/Ishan-bit-maker" rel="noopener noreferrer">github</a>
        <a href="https://www.linkedin.com/in/ishan-shrestha-365944280" rel="noopener noreferrer">linkedin</a>
      </footer>
    </div>
  </body>
</html>
