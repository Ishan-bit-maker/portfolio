<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Ishan Shrestha — resources." />
    <title>Resources — Ishan Shrestha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0d0d0d;
        --fg: rgba(245, 245, 245, 0.94);
        --muted: rgba(245, 245, 245, 0.48);
        --faint: rgba(245, 245, 245, 0.22);
        --blue: #73b1ff;
        --blue-dim: rgba(115, 177, 255, 0.85);
        --term-green: #4ade80;
        --sel-bg: rgba(115, 177, 255, 0.18);
        --sel-fg: var(--fg);
        --max: 1100px;
        --ease: 0.18s ease;
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        line-height: 1.75;
      }
      ::selection { background: var(--sel-bg); color: var(--sel-fg); }

      a { color: var(--blue); text-decoration: none; transition: color var(--ease), opacity var(--ease); }
      a:hover { color: var(--blue-dim); text-decoration: underline; text-underline-offset: 4px; }
      a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
      a:visited { color: var(--blue); }

      .wrap { max-width: var(--max); margin: 0 auto; padding: 38px 18px 80px; }
      header { margin-top: 8px; }

      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px 18px;
        margin-bottom: 32px;
        color: #ffffff;
        font-size: 13px;
      }
      nav a {
        color: #888888;
        text-decoration: none;
        transition: color var(--ease);
      }
      nav a.active {
        color: #888888;
      }
      nav a[href="index.html"] {
        color: #ffffff;
      }
      nav a:hover {
        color: var(--blue);
        text-decoration: none;
        opacity: 1;
      }
      nav a:active {
        color: var(--blue);
      }

      h1 { margin: 0; font-size: 1.15rem; font-weight: 600; color: var(--fg); }
      .sub { margin-top: 8px; color: var(--muted); font-size: 13px; }

      main { margin-top: 28px; }

      .list { display: grid; gap: 14px; margin-top: 18px; }
      .item { color: var(--muted); }
      .item a { font-weight: 500; }

      .termline {
        margin: 22px 0 10px;
        color: var(--term-green);
        font-size: 13px;
        white-space: nowrap;
      }
      .prompt { color: var(--term-green); }
      .cursor {
        display: inline-block;
        margin-left: 2px;
        animation: blink 1.1s step-end infinite;
      }
      .cursor::after {
        content: "_";
        color: var(--term-green);
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .imgstrip {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 132px;
        gap: 10px;
        overflow-x: auto;
        padding: 8px 0 4px;
        scrollbar-width: thin;
      }
      .imgstrip::-webkit-scrollbar { height: 8px; }
      .imgstrip::-webkit-scrollbar-thumb { background: rgba(115, 177, 255, 0.2); }
      .imgstrip::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); }

      .imgstrip img {
        width: 132px;
        height: 168px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.02);
        transition: border-color var(--ease), transform var(--ease);
      }
      .imgstrip img:hover {
        border-color: rgba(115, 177, 255, 0.35);
        transform: translateY(-2px);
      }

      footer {
        margin-top: 56px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 18px;
        color: #ffffff;
        font-size: 13px;
      }
      footer a, footer a:visited { color: #ffffff; text-decoration: none; }
      footer a:hover { color: #ffffff; opacity: 0.72; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <nav aria-label="Primary">
          <a href="index.html">home</a>
          <a href="blog.html">blog</a>

          <a href="about-min.html">about</a>
          <a href="resources.html" class="active">resources</a>
        </nav>

        <h1>resources</h1>
        <div class="sub">links i actually use.</div>
      </header>

      <main>
        <div class="list" aria-label="resource links">
          <div class="item"><a href="blog.html">writing</a> — notes on software, learning, keeping things simple</div>
          <div class="item"><a href="blog/survival-log.html">a survival log</a> — longform personal log</div>
          <div class="item"><a href="about.html">old about page</a> — previous design (still here)</div>
          <div class="item"><a href="https://github.com/Ishan-bit-maker" rel="noopener noreferrer">github</a> — code</div>
          <div class="item"><a href="https://www.linkedin.com/in/ishan-shrestha-365944280" rel="noopener noreferrer">linkedin</a> — profile</div>
        </div>

        <div class="termline">
          <span class="prompt">$</span> cat /dev/aesthetic <span class="cursor" aria-hidden="true"></span>
        </div>
        <div class="imgstrip" aria-label="aesthetic images">
          <img src="img/img1.jpg" alt="" loading="lazy" />
          <img src="img/img2.jpg" alt="" loading="lazy" />
          <img src="img/img3.jpg" alt="" loading="lazy" />
          <img src="img/img4.jpg" alt="" loading="lazy" />
          <img src="img/img5.jpg" alt="" loading="lazy" />
          <img src="img/img8.jpg" alt="" loading="lazy" />
        </div>
      </main>

      <footer>
        <a href="https://github.com/Ishan-bit-maker" rel="noopener noreferrer">github</a>
        <a href="https://www.linkedin.com/in/ishan-shrestha-365944280" rel="noopener noreferrer">linkedin</a>
      </footer>
    </div>
  </body>
</html>
