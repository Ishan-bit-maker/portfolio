<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Ishan Shrestha — dailies." />
    <title>Dailies — Ishan Shrestha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0d0d0d;
        --fg: rgba(245, 245, 245, 0.94);
        --muted: rgba(245, 245, 245, 0.48);
        --faint: rgba(245, 245, 245, 0.22);
        --blue: #73b1ff;
        --blue-dim: rgba(115, 177, 255, 0.85);
        --green-date: #5c7e5c;
        --sel-bg: rgba(115, 177, 255, 0.18);
        --sel-fg: var(--fg);
        --max: 900px;
        --ease: 0.18s ease;
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        line-height: 1.75;
      }
      ::selection { background: var(--sel-bg); color: var(--sel-fg); }

      a { color: var(--blue); text-decoration: none; transition: color var(--ease), opacity var(--ease); }
      a:hover { color: var(--blue-dim); text-decoration: underline; text-underline-offset: 4px; }
      a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
      a:visited { color: var(--blue); }

      .wrap { max-width: var(--max); margin: 0 auto; padding: 38px 18px 80px; }
      header { margin-top: 8px; }

      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px 18px;
        margin-bottom: 32px;
        color: #ffffff;
        font-size: 13px;
      }
      nav a {
        color: #888888;
        text-decoration: none;
        transition: color var(--ease);
      }
      nav a.active {
        color: #888888;
      }
      nav a[href="index.html"] {
        color: #ffffff;
      }
      nav a:hover {
        color: var(--blue);
        text-decoration: none;
        opacity: 1;
      }
      nav a:active {
        color: var(--blue);
      }

      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--fg);
      }
      .sub { margin-top: 8px; color: var(--muted); font-size: 13px; }

      main { margin-top: 28px; }

      .list { display: grid; gap: 1.25rem; margin-top: 18px; }
      .row { display: grid; grid-template-columns: 110px 1fr; gap: 16px; }
      .date { color: var(--green-date); font-size: 13px; }
      .txt { color: var(--muted); font-size: 14px; }

      footer {
        margin-top: 56px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 18px;
        color: #ffffff;
        font-size: 13px;
      }
      footer a, footer a:visited { color: #ffffff; text-decoration: none; }
      footer a:hover { color: #ffffff; opacity: 0.72; }

      @media (max-width: 520px) {
        .row { grid-template-columns: 92px 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <nav aria-label="Primary">
          <a href="index.html">home</a>
          <a href="blog.html">blog</a>
          <a href="dailies.html" class="active">dailies</a>
          <a href="about-min.html">about</a>
          <a href="resources.html">resources</a>
        </nav>

        <h1>dailies</h1>
        <div class="sub">small logs. no pressure. just receipts.</div>
      </header>

      <main>
        <div class="list" aria-label="daily entries">
          <div class="row">
            <div class="date">2026-04-18</div>
            <div class="txt">shipped a minimalist homepage; deleted a lot of CSS.</div>
          </div>
          <div class="row">
            <div class="date">2026-03-15</div>
            <div class="txt">published <a href="blog/survival-log.html">survival log</a> draft.</div>
          </div>
          <div class="row">
            <div class="date">2026-02-10</div>
            <div class="txt">wrote a note about keeping things small.</div>
          </div>
        </div>
      </main>

      <footer>
        <a href="https://github.com/Ishan-bit-maker" rel="noopener noreferrer">github</a>
        <a href="https://www.linkedin.com/in/ishan-shrestha-365944280" rel="noopener noreferrer">linkedin</a>
      </footer>
    </div>
  </body>
</html>
